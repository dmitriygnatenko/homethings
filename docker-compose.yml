version: "3"

services:
  db:
    image: postgres:15.1-alpine
    ports:
      - ${DB_PORT}:5432
    volumes:
      - homethings_pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

volumes:
  homethings_pg_data: