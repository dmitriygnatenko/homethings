services:

  app:
    build:
      context: /opt/app/src
      dockerfile: /opt/app/src/build/docker/Dockerfile
    container_name: homethings
    ports:
      - "8888:8080"
    environment:
      - APP_PORT=
      - DB_DRIVER=mysql
      - DB_HOST=
      - DB_PORT=
      - DB_NAME=
      - DB_USER=
      - DB_PASSWORD=
      - DB_MAX_OPEN_CONNS=
      - DB_MAX_IDLE_CONNS=
      - DB_MAX_CONN_LIFETIME=
      - DB_MAX_IDLE_CONN_LIFETIME=
      - CORS_ALLOW_ORIGING=
      - CORS_ALLOW_METHODS=
      - JWT_SECRET_KEY=
      - JWT_LIFETIME=
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASSWORD=
      - BASIC_AUTH_USER=
      - BASIC_AUTH_PASSWORD=
      - LOGGER_STDOUT_ENABLED=true
      - LOGGER_STDOUT_LEVEL=info
      - LOGGER_EMAIL_ENABLED=true
      - LOGGER_EMAIL_LEVEL=error
      - LOGGER_EMAIL_RECIPIENT=
      - LOGGER_EMAIL_SUBJECT=
    depends_on:
      mariadb:
        condition: service_started
