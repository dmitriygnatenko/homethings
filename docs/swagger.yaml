definitions:
  dto.AddPlaceRequest:
    properties:
      parent_id:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  dto.AddTagRequest:
    properties:
      style:
        type: string
      title:
        type: string
    required:
    - style
    - title
    type: object
  dto.AddThingNotificationRequest:
    properties:
      notification_date:
        format: date-time
        type: string
      thing_id:
        type: integer
    required:
    - notification_date
    - thing_id
    type: object
  dto.AddThingRequest:
    properties:
      description:
        type: string
      place_id:
        type: integer
      title:
        type: string
    required:
    - place_id
    - title
    type: object
  dto.AddUserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.EmptyResponse:
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dto.ImageResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      image:
        type: string
      place_id:
        type: integer
      thing_id:
        type: integer
    type: object
  dto.ImagesResponse:
    properties:
      images:
        items:
          $ref: '#/definitions/dto.ImageResponse'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
    type: object
  dto.PlaceResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      parent_id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.PlaceTree:
    properties:
      nested:
        items:
          $ref: '#/definitions/dto.PlaceTree'
        type: array
      place:
        $ref: '#/definitions/dto.PlaceResponse'
    type: object
  dto.PlaceTreeResponse:
    properties:
      places:
        items:
          $ref: '#/definitions/dto.PlaceTree'
        type: array
    type: object
  dto.PlacesResponse:
    properties:
      places:
        items:
          $ref: '#/definitions/dto.PlaceResponse'
        type: array
    type: object
  dto.TagResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      style:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.TagsResponse:
    properties:
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
    type: object
  dto.ThingExtResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      place_id:
        type: integer
      tags:
        items:
          $ref: '#/definitions/dto.TagResponse'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.ThingNotificationExtResponse:
    properties:
      created_at:
        type: string
      notification_date:
        type: string
      place_id:
        type: integer
      place_title:
        type: string
      thing_id:
        type: integer
      thing_title:
        type: string
      updated_at:
        type: string
    type: object
  dto.ThingNotificationResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      notification_date:
        type: string
      updated_at:
        type: string
    type: object
  dto.ThingNotificationsExtResponse:
    properties:
      notifications:
        items:
          $ref: '#/definitions/dto.ThingNotificationExtResponse'
        type: array
    type: object
  dto.ThingResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      place_id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.ThingsExtResponse:
    properties:
      things:
        items:
          $ref: '#/definitions/dto.ThingExtResponse'
        type: array
    type: object
  dto.UpdatePlaceRequest:
    properties:
      parent_id:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  dto.UpdateTagRequest:
    properties:
      style:
        type: string
      title:
        type: string
    required:
    - style
    - title
    type: object
  dto.UpdateThingNotificationRequest:
    properties:
      notification_date:
        format: date-time
        type: string
    required:
    - notification_date
    type: object
  dto.UpdateThingRequest:
    properties:
      description:
        type: string
      place_id:
        type: integer
      title:
        type: string
    required:
    - place_id
    - title
    type: object
  dto.UpdateUserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  dto.UserResponse:
    properties:
      username:
        type: string
    type: object
