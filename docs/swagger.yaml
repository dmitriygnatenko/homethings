definitions:
  dto.AddPlaceRequest:
    properties:
      parent_id:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  dto.AddThingRequest:
    properties:
      description:
        type: string
      place_id:
        type: integer
      title:
        type: string
    required:
    - place_id
    - title
    type: object
  dto.AddUserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.EmptyResponse:
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dto.ImageResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      image:
        type: string
      place_id:
        type: integer
      thing_id:
        type: integer
    type: object
  dto.ImagesResponse:
    properties:
      images:
        items:
          $ref: '#/definitions/dto.ImageResponse'
        type: array
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResponse:
    properties:
      token:
        type: string
    type: object
  dto.PlaceResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      parent_id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.PlaceTree:
    properties:
      nested:
        items:
          $ref: '#/definitions/dto.PlaceTree'
        type: array
      place:
        $ref: '#/definitions/dto.PlaceResponse'
    type: object
  dto.PlaceTreeResponse:
    properties:
      places:
        items:
          $ref: '#/definitions/dto.PlaceTree'
        type: array
    type: object
  dto.PlacesResponse:
    properties:
      places:
        items:
          $ref: '#/definitions/dto.PlaceResponse'
        type: array
    type: object
  dto.ThingResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      place_id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.ThingsResponse:
    properties:
      things:
        items:
          $ref: '#/definitions/dto.ThingResponse'
        type: array
    type: object
  dto.UpdatePlaceRequest:
    properties:
      parent_id:
        type: integer
      title:
        type: string
    required:
    - title
    type: object
  dto.UpdateThingRequest:
    properties:
      description:
        type: string
      place_id:
        type: integer
      title:
        type: string
    required:
    - place_id
    - title
    type: object
  dto.UpdateUserRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  title: Homethings API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Request body
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
